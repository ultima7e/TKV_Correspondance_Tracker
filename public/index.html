<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in – Correspondence Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:20px}
.card{width:100%;max-width:360px;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:30px 26px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.project{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#64748b;font-weight:700}
h1{font-size:19px;color:#f1f5f9;margin:4px 0 2px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:700;color:#cbd5e1;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 5px}
input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;font-size:14px;color:#f1f5f9;outline:none}
input:focus{border-color:#2563eb}
button{width:100%;margin-top:22px;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:default}
.err{min-height:16px;margin-top:12px;font-size:12px;color:#f87171;text-align:center}
.credit{margin-top:20px;font-size:10px;color:#475569;text-align:center}
</style>
</head>
<body>
<form class="card" id="login-form" autocomplete="on">
  <div class="project">Tamakoshi V HEP</div>
  <h1>Correspondence Tracker</h1>
  <div class="sub">Please sign in to continue</div>
  <label for="u">Username</label>
  <input id="u" name="username" type="text" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="btn">Sign in</button>
  <div class="err" id="err"></div>
  <div class="credit">created by Sagar Bhattarai</div>
</form>
<script>
// If already signed in, skip straight to the tracker.
fetch('/api/me').then((r)=>{ if(r.ok) location.href='tracker.html'; }).catch(()=>{});

document.getElementById('login-form').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Login failed');
    location.href='tracker.html';
  }catch(ex){
    err.textContent=ex.message; btn.disabled=false; btn.textContent='Sign in';
  }
});
</script>
</body>
</html>
